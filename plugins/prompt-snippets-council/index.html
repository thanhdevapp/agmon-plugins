<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Council, Prompt Enhancer & Snippets</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="shell">
  <div class="bar"><h1>AI Council &amp; Prompt Enhancer</h1><select id="level"><option value="1">L1: Concise</option><option value="2">L2: Scoped + Edge Cases</option><option value="3" selected>L3: +Rules &amp; Tests</option><option value="4">L4: Architecture + Security</option><option value="5">L5: Blind Council Rubric</option></select></div>
  <div class="body">
    <textarea id="raw" class="input" style="width:100%;height:74px;" placeholder="Describe task or architecture question..."></textarea>
    <div style="margin:6px 0;display:flex;gap:6px;"><button class="btn primary" id="btnBuild">Build Prompt</button><button class="btn" id="btnSaveSnip">Save Snippet</button></div>
    <textarea id="out" class="input mono" style="width:100%;height:120px;" readonly></textarea>
    <div class="card" style="margin-top:8px;"><strong>Saved Snippets</strong><div id="snips" style="margin-top:6px;"></div></div>
  </div>
</div>
  <script src="./main.js"></script>
</body>
</html>
